<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動物界 分類 クイズ（門・綱・目・科）</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-1">動物界 分類 クイズ</h1>
    <p class="text-gray-500 mb-2 text-sm">門（phylum）→ 綱（class）の2段階クイズ・30問</p>

    <!-- Score -->
    <div class="flex gap-4 mb-6">
      <div class="bg-white rounded-xl shadow px-4 py-2 text-center">
        <p class="text-xs text-gray-400">スコア</p>
        <p id="scoreDisp" class="text-xl font-bold text-emerald-600">0</p>
      </div>
      <div class="bg-white rounded-xl shadow px-4 py-2 text-center">
        <p class="text-xs text-gray-400">正答率</p>
        <p id="accuracyDisp" class="text-xl font-bold text-sky-600">—</p>
      </div>
      <div class="bg-white rounded-xl shadow px-4 py-2 text-center">
        <p class="text-xs text-gray-400">問題</p>
        <p id="qNum" class="text-xl font-bold text-gray-700">1 / 30</p>
      </div>
      <div class="ml-auto flex items-center">
        <button onclick="restartQuiz()" aria-label="最初からやり直す" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm font-semibold transition">リセット</button>
      </div>
    </div>

    <!-- Quiz card -->
    <div id="quizArea">
      <div class="bg-white rounded-2xl shadow-lg p-6 mb-4">
        <p id="stageLabel" class="text-xs font-semibold text-amber-600 mb-1 uppercase tracking-wide">Step 1: 門を選択</p>
        <h2 id="animalName" class="text-2xl font-bold text-gray-800 mb-1"></h2>
        <p id="animalDesc" class="text-gray-500 text-sm mb-4"></p>
        <div id="choices" class="grid grid-cols-2 gap-3"></div>
      </div>

      <!-- Feedback -->
      <div id="feedback" class="hidden bg-white rounded-2xl shadow p-5 mb-4">
        <p id="feedbackText" class="font-semibold text-lg mb-1"></p>
        <div id="factCard" class="bg-amber-50 rounded-xl p-4 text-sm text-gray-700"></div>
        <button id="nextBtn" onclick="nextStep()" aria-label="次へ" class="mt-4 w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl transition">次へ →</button>
      </div>
    </div>

    <!-- Final screen -->
    <div id="finalScreen" class="hidden bg-white rounded-2xl shadow-lg p-8 text-center">
      <p class="text-4xl mb-2">🎉</p>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">クイズ完了！</h2>
      <p id="finalScore" class="text-lg text-gray-600 mb-4"></p>
      <button onclick="restartQuiz()" aria-label="もう一度プレイ" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-8 py-3 rounded-xl transition">もう一度プレイ</button>
    </div>
  </div>

  <script>
    const animals = [
      { name:'ライオン', desc:'サバンナに生息する大型肉食動物。群れ（プライド）で生活する。', phylum:'脊索動物門', classis:'哺乳綱', facts:'哺乳類の中でも唯一群れを作るネコ科動物。妊娠期間約110日。' },
      { name:'タコ', desc:'8本の腕を持つ軟体動物。高い知能を持つ。', phylum:'軟体動物門', classis:'頭足綱', facts:'軟体動物門・頭足綱。3つの心臓と青い血液を持つ。' },
      { name:'ミミズ', desc:'土壌中に生息し有機物を分解する。環状の体節を持つ。', phylum:'環形動物門', classis:'貧毛綱', facts:'環形動物門。体の再生能力があり、土壌改良に貢献する。' },
      { name:'カブトムシ', desc:'日本の森林に生息する甲虫の一種。オスは大きな角を持つ。', phylum:'節足動物門', classis:'昆虫綱', facts:'節足動物門・昆虫綱。外骨格・3対の脚・複眼が特徴。' },
      { name:'ウニ', desc:'棘皮動物の一種。管足と棘で移動する。', phylum:'棘皮動物門', classis:'ウニ綱', facts:'棘皮動物門。5放射相称の体制を持ち、再生能力が高い。' },
      { name:'カエル', desc:'幼生（オタマジャクシ）は水中、成体は陸上でも生活できる。', phylum:'脊索動物門', classis:'両生綱', facts:'両生綱。皮膚呼吸ができ、環境の指標生物として重要。' },
      { name:'イカ', desc:'10本の腕を持つ軟体動物。高速遊泳が可能。', phylum:'軟体動物門', classis:'頭足綱', facts:'タコと同じく頭足綱。墨（インク）で敵を撹乱する。' },
      { name:'サバ', desc:'海洋に広く分布する青背の魚。高速で泳ぐ。', phylum:'脊索動物門', classis:'条鰭綱', facts:'条鰭綱（硬骨魚類）。DHA・EPAが豊富な食用魚。' },
      { name:'クモ', desc:'8本の脚を持つ肉食性の節足動物。糸で巣を作る。', phylum:'節足動物門', classis:'クモ綱', facts:'節足動物門・クモ綱。昆虫とは異なり脚が4対。' },
      { name:'ヒトデ', desc:'5本腕を持つ棘皮動物。管足で移動しながら貝を食べる。', phylum:'棘皮動物門', classis:'ヒトデ綱', facts:'棘皮動物門。胃を体外に出して獲物を消化する独特の摂食行動。' },
      { name:'ワシ', desc:'鋭い爪と視力を持つ大型の猛禽類。上昇気流を使い滑空する。', phylum:'脊索動物門', classis:'鳥綱', facts:'鳥綱（Aves）。前肢が翼に進化し、軽量な中空骨格を持つ。' },
      { name:'カニ', desc:'10本の脚と大きな爪を持つ甲殻類。横歩きが特徴。', phylum:'節足動物門', classis:'軟甲綱', facts:'節足動物門・軟甲綱（甲殻亜門）。エビやシャコと同じ仲間。' },
      { name:'イソギンチャク', desc:'触手で獲物を捕らえる固着性の動物。サンゴと近縁。', phylum:'刺胞動物門', classis:'花虫綱', facts:'刺胞動物門。刺細胞（nematocyst）で獲物を麻痺させる。' },
      { name:'ヘビ', desc:'四肢を持たない爬虫類。鱗で覆われた胴体で移動する。', phylum:'脊索動物門', classis:'爬虫綱', facts:'爬虫綱。四肢退化の進化で体節筋肉を使い移動する。' },
      { name:'クラゲ', desc:'透明な傘形の体を持つ刺胞動物。触手で獲物を捕らえる。', phylum:'刺胞動物門', classis:'鉢虫綱', facts:'刺胞動物門・鉢虫綱。体の95%以上が水分。' },
      { name:'ミジンコ', desc:'淡水中に生息する微小な甲殻類。プランクトンとして重要。', phylum:'節足動物門', classis:'軟甲綱', facts:'節足動物門・軟甲綱（枝角目）。単性生殖と有性生殖を使い分ける。' },
      { name:'ゴリラ', desc:'アフリカの熱帯雨林に生息する大型霊長類。草食傾向が強い。', phylum:'脊索動物門', classis:'哺乳綱', facts:'哺乳綱・霊長目。ヒトのDNAとの一致率は約98.3%。' },
      { name:'ホタルイカ', desc:'自ら光を発する能力を持つ小型のイカ。', phylum:'軟体動物門', classis:'頭足綱', facts:'軟体動物門・頭足綱。生物発光をコミュニケーションや擬態に利用。' },
      { name:'ムカデ', desc:'多数の足を持つ肉食性の多足類。毒を持つ種が多い。', phylum:'節足動物門', classis:'唇脚綱', facts:'節足動物門・唇脚綱。脚の対数は必ず奇数。' },
      { name:'ナマコ', desc:'棘皮動物の一種。管足で砂底を移動し有機物を食べる。', phylum:'棘皮動物門', classis:'ナマコ綱', facts:'棘皮動物門・ナマコ綱。危険を感じると内臓を吐き出して身を守る。' },
      { name:'コイ', desc:'淡水域に生息する大型の硬骨魚。観賞用として世界中で飼育される。', phylum:'脊索動物門', classis:'条鰭綱', facts:'条鰭綱・コイ目。100年以上生きる個体も存在する長寿魚。' },
      { name:'ハチ', desc:'社会性昆虫の代表。女王バチ・働きバチ・オスバチに分業化。', phylum:'節足動物門', classis:'昆虫綱', facts:'節足動物門・昆虫綱・膜翅目。花粉媒介者として生態系に不可欠。' },
      { name:'タツノオトシゴ', desc:'馬のような頭部を持つ魚類。オスが卵を育てる珍しい習性。', phylum:'脊索動物門', classis:'条鰭綱', facts:'条鰭綱・トゲウオ目。オスが育児嚢で稚魚を産む唯一の動物。' },
      { name:'アカサンゴ', desc:'宝石珊瑚とも呼ばれる刺胞動物。深海に群落を形成する。', phylum:'刺胞動物門', classis:'花虫綱', facts:'刺胞動物門・花虫綱。ポリプが石灰質骨格を分泌して成長する。' },
      { name:'サソリ', desc:'クモ綱に属する肉食性の節足動物。尾端に毒針を持つ。', phylum:'節足動物門', classis:'クモ綱', facts:'節足動物門・クモ綱・サソリ目。紫外線に反応して蛍光を発する。' },
      { name:'チンパンジー', desc:'類人猿の中で最もヒトに近い種。道具を使う行動が観察される。', phylum:'脊索動物門', classis:'哺乳綱', facts:'哺乳綱・霊長目。草食から肉食まで雑食性で文化的行動を持つ。' },
      { name:'カキ（牡蠣）', desc:'固着性の二枚貝。ろ過食性で水質浄化に貢献する。', phylum:'軟体動物門', classis:'二枚貝綱', facts:'軟体動物門・二枚貝綱。1日に数百リットルの海水をろ過できる。' },
      { name:'センチコガネ', desc:'甲虫の一種。糞を丸めて転がす行動が有名（スカラベ）。', phylum:'節足動物門', classis:'昆虫綱', facts:'節足動物門・昆虫綱・甲虫目。古代エジプトでは神聖視された。' },
      { name:'ワニ', desc:'大型爬虫類。変温動物だが高度な親の行動を持つ。', phylum:'脊索動物門', classis:'爬虫綱', facts:'爬虫綱・ワニ目。現生爬虫類の中では最も鳥類に近縁な系統。' },
      { name:'アオリイカ', desc:'日本沿岸に生息する大型のコウイカの仲間。味が良い食用種。', phylum:'軟体動物門', classis:'頭足綱', facts:'軟体動物門・頭足綱・コウイカ目。皮膚色素胞で色と模様を素早く変える。' },
    ];

    const phylumChoices = ['脊索動物門','節足動物門','軟体動物門','環形動物門','棘皮動物門','刺胞動物門'];
    const classChoices = ['哺乳綱','鳥綱','爬虫綱','両生綱','条鰭綱','頭足綱','二枚貝綱','昆虫綱','クモ綱','軟甲綱','唇脚綱','貧毛綱','ウニ綱','ヒトデ綱','ナマコ綱','花虫綱','鉢虫綱'];

    let order = [], qIdx = 0, step = 0, score = 0, answered = 0;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length-1; i>0; i--) {
        const j = Math.floor(Math.random() * (i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function restartQuiz() {
      order = shuffle([...Array(animals.length).keys()]).slice(0, 30);
      qIdx = 0; step = 0; score = 0; answered = 0;
      document.getElementById('finalScreen').classList.add('hidden');
      document.getElementById('quizArea').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const animal = animals[order[qIdx]];
      document.getElementById('qNum').textContent = `${qIdx+1} / 30`;
      document.getElementById('stageLabel').textContent = step === 0 ? 'Step 1: 門を選択してください' : 'Step 2: 綱を選択してください';
      document.getElementById('animalName').textContent = animal.name;
      document.getElementById('animalDesc').textContent = animal.desc;
      document.getElementById('feedback').classList.add('hidden');

      const correct = step === 0 ? animal.phylum : animal.classis;
      const pool = step === 0 ? phylumChoices : classChoices;
      const wrong = shuffle(pool.filter(c => c !== correct)).slice(0, 3);
      const opts = shuffle([correct, ...wrong]);

      const choices = document.getElementById('choices');
      choices.innerHTML = '';
      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'px-4 py-3 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl text-sm font-semibold text-gray-700 transition text-left';
        btn.setAttribute('aria-label', opt);
        btn.textContent = opt;
        btn.addEventListener('click', () => answer(opt, correct, animal));
        choices.appendChild(btn);
      });
    }

    function answer(chosen, correct, animal) {
      const isCorrect = chosen === correct;
      if (isCorrect) score++;
      answered++;

      document.getElementById('choices').querySelectorAll('button').forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === correct) btn.className = 'px-4 py-3 bg-green-100 border border-green-400 rounded-xl text-sm font-semibold text-green-700';
        else if (btn.textContent === chosen && !isCorrect) btn.className = 'px-4 py-3 bg-red-100 border border-red-400 rounded-xl text-sm font-semibold text-red-700';
      });

      const fb = document.getElementById('feedback');
      fb.classList.remove('hidden');
      document.getElementById('feedbackText').textContent = isCorrect ? '✅ 正解！' : `❌ 不正解。正解は「${correct}」`;
      document.getElementById('feedbackText').className = `font-semibold text-lg mb-1 ${isCorrect ? 'text-green-600' : 'text-red-500'}`;
      document.getElementById('factCard').textContent = animal.facts;

      document.getElementById('scoreDisp').textContent = score;
      const acc = Math.round(score / answered * 100);
      document.getElementById('accuracyDisp').textContent = acc + '%';

      const nextLabel = step === 0 ? '次のステップへ（綱を選ぶ）→' : (qIdx < 29 ? '次の問題へ →' : '結果を見る');
      document.getElementById('nextBtn').textContent = nextLabel;
    }

    function nextStep() {
      if (step === 0) {
        step = 1;
        showQuestion();
      } else {
        step = 0;
        qIdx++;
        if (qIdx >= 30) {
          document.getElementById('quizArea').classList.add('hidden');
          document.getElementById('finalScreen').classList.remove('hidden');
          document.getElementById('finalScore').textContent = `${score} / ${answered} 正解（正答率 ${Math.round(score/answered*100)}%）`;
        } else {
          showQuestion();
        }
      }
    }

    restartQuiz();
  </script>
</body>
</html>
